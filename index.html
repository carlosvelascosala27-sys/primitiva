<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>¿Me ha tocado? · Primitiva</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Courier+Prime:wght@400;700&display=swap">
<style>
:root{--bg:#0f3d2f;--paper:#fbfaf6;--ink:#1c211f;--mut:#5d655f;--line:#c9cec6;--hit:#ffd23f;--hitink:#2a2200;--ok:#0f6b3d;--okbg:#dff3e6;--no:#7a1f1f;--nobg:#f6e3e1;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#08241c;--paper:#1b211e;--ink:#eef1ec;--mut:#9aa39c;--line:#3a443e;--hit:#e6b800;--hitink:#1a1500;--ok:#7fe0a8;--okbg:#17382a;--no:#f0a8a2;--nobg:#3a2321}}
:root[data-theme="dark"]{--bg:#08241c;--paper:#1b211e;--ink:#eef1ec;--mut:#9aa39c;--line:#3a443e;--hit:#e6b800;--hitink:#1a1500;--ok:#7fe0a8;--okbg:#17382a;--no:#f0a8a2;--nobg:#3a2321}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.4 "Atkinson Hyperlegible",system-ui,sans-serif}
main{max-width:460px;margin:0 auto;padding:18px 14px 40px}
h1{color:#f3f1e6;font-size:28px;margin:4px 2px 16px;line-height:1.15}
h2{font-size:19px;margin:0 0 12px}
h3{font-size:17px;margin:14px 0 6px}
.card{background:var(--paper);border-radius:6px;padding:16px;margin-bottom:14px}
.hint{color:var(--mut);font-size:15px}
.st{color:#cfe3d9;font-size:15px;margin:0 2px 14px}
.nums{display:flex;gap:6px;align-items:center}
.n,.date{border:2px solid var(--line);border-radius:6px;background:transparent;color:var(--ink)}
.n{width:46px;height:50px;text-align:center;font:700 23px "Courier Prime",ui-monospace,monospace;padding:0}
.n.big{width:70px;height:62px;font-size:32px}
.date{font:700 20px "Atkinson Hyperlegible",system-ui,sans-serif;padding:10px;width:100%;margin-bottom:14px}
.n:focus,.date:focus{outline:3px solid var(--ok);outline-offset:1px}
.line{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.line b{width:18px;font:700 18px "Courier Prime",monospace}
.row{display:flex;gap:8px;margin-top:8px}
button{font:700 19px "Atkinson Hyperlegible",system-ui,sans-serif;border:0;border-radius:8px;padding:15px 18px;width:100%;cursor:pointer}
.go{background:var(--hit);color:var(--hitink);margin-bottom:14px;font-size:22px}
.ghost{background:transparent;color:var(--ink);border:2px dashed var(--line);font-size:16px;padding:11px}
.banner{padding:14px;border-radius:6px;font-weight:700;font-size:21px;margin-bottom:12px}
.ok{background:var(--okbg);color:var(--ok)}.no{background:var(--nobg);color:var(--no)}
.res .line{flex-wrap:wrap;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{width:36px;height:40px;display:grid;place-items:center;border-radius:6px;font:700 19px "Courier Prime",monospace;border:2px solid var(--line);color:var(--mut)}
.chip.hit{background:var(--hit);color:var(--hitink);border-color:var(--hit)}
.tag{font-size:14px;color:var(--mut);align-self:center;margin:0 2px 0 8px}
.verdict{flex-basis:100%;margin-left:26px;font-size:16px}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:6px 4px;border-top:1px solid var(--line)}
td:last-child,th:last-child{text-align:right}
tr.mine td{font-weight:700;background:var(--okbg);color:var(--ok)}
</style></head><body><main>
<h1>¿Me ha tocado la Primitiva?</h1>
<p class="st" id="st"></p>

<section class="card">
<h2>Esta semana</h2>
<label class="hint" for="fecha">Fecha del sorteo</label>
<input class="date" type="date" id="fecha">
<label class="hint" for="reiT">Mi reintegro</label>
<div class="nums"><input class="n big" id="reiT" maxlength="1" inputmode="numeric" placeholder="0-9"></div>
</section>

<section class="card">
<h2>Mis líneas</h2>
<div id="lines"></div>
<div class="row"><button class="ghost" id="add">+ Añadir línea</button><button class="ghost" id="del">Quitar última</button></div>
<p class="hint">Ya están puestas y se guardan en este móvil. Si algún día cambian, se pueden editar.</p>
</section>

<button class="go" id="go">Comprobar</button>
<section id="out"></section>
</main>
<script>
const $=s=>document.querySelector(s),p2=n=>String(n).padStart(2,'0');
const pad=v=>v===''||v==null||isNaN(v)?'':p2(v);
const EUR=n=>new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR'}).format(n);
const CATS=[{k:'6r',t:'Especial',d:'6 aciertos + reintegro'},{k:'6',t:'1ª',d:'6 aciertos'},{k:'5c',t:'2ª',d:'5 aciertos + complementario'},{k:'5',t:'3ª',d:'5 aciertos'},{k:'4',t:'4ª',d:'4 aciertos'},{k:'3',t:'5ª',d:'3 aciertos'},{k:'r',t:'Reintegro',d:''}];
const T=[[1,5,9,10,20,27],[1,3,15,29,35,40],[2,18,22,30,34,37],[1,2,4,13,26,27],[1,10,15,36,39,40]];
let DATA={};
const K='primitiva_lineas';
const save=()=>{try{localStorage.setItem(K,JSON.stringify([...$('#lines').children].map(d=>[...d.querySelectorAll('.n')].map(x=>x.value))))}catch(e){}};
const load=()=>{try{const l=JSON.parse(localStorage.getItem(K));return l&&l.some(r=>r.some(x=>x!==''))?l:null}catch(e){return null}};
function inputs(box,vals){for(let i=0;i<6;i++){const e=document.createElement('input');e.className='n';e.maxLength=2;e.inputMode='numeric';e.value=vals&&vals[i]!==''&&vals[i]!=null?pad(vals[i]):'';box.appendChild(e)}}
function addLine(v){const d=document.createElement('div'),i=$('#lines').children.length+1;d.className='line';d.innerHTML='<b>'+i+'</b><div class="nums"></div>';inputs(d.querySelector('.nums'),v);$('#lines').appendChild(d)}
function lastSat(){const d=new Date();d.setDate(d.getDate()-((d.getDay()+1)%7));return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
(load()||T).forEach(addLine);
$('#fecha').value=lastSat();
$('#add').onclick=()=>{if($('#lines').children.length<8){addLine();save()}};
$('#del').onclick=()=>{const l=$('#lines');if(l.children.length>1){l.lastChild.remove();save()}};
document.addEventListener('input',e=>{const t=e.target;if(!t.classList.contains('n'))return;if(t.closest('#lines'))save();if(t.value.length>=t.maxLength){const a=[...document.querySelectorAll('input.n')];const n=a[a.indexOf(t)+1];n&&n.focus()}});
function status(){const k=Object.keys(DATA).sort();$('#st').textContent=k.length?'Último resultado cargado: '+k[k.length-1].split('-').reverse().join('/')+'.':'Todavía no hay resultados cargados.'}
fetch('resultados.json?'+Date.now()).then(r=>r.json()).then(j=>{DATA=j;const k=Object.keys(j).sort();if(k.length)$('#fecha').value=k[k.length-1]}).catch(()=>{}).finally(status);
$('#go').onclick=check;
function check(){
const out=$('#out'),f=$('#fecha').value,mine=$('#reiT').value,D=DATA[f];
if(mine===''){out.innerHTML='<div class="banner no">Escribe tu reintegro de esta semana.</div>';$('#reiT').focus();return}
if(!D){out.innerHTML='<div class="banner no">Todavía no tengo el resultado de ese sorteo. Prueba más tarde.</div>';return}
const R=D.n,C=D.c,RR=String(D.r),P=D.premios,rei=RR===mine;
let prize=false,html='',n=0,tot=0,unk=false;const won=new Set();
[...$('#lines').children].forEach((d,i)=>{
const v=[...d.querySelectorAll('.n')].map(x=>x.value===''?NaN:+x.value);
if(v.every(isNaN))return;n++;let txt;
if(v.some(x=>isNaN(x)||x<1||x>49)||new Set(v).size<6){txt='Línea incompleta o con números repetidos'}
else{const h=v.filter(x=>R.includes(x)).length,c=h===5&&v.some(x=>!R.includes(x)&&x===C);
const key=h===6?(rei?'6r':'6'):c?'5c':h>=3?String(h):null;
if(key){prize=true;won.add(key);const cat=CATS.find(x=>x.k===key),e=P&&P[key]?P[key].e:null;if(e==null)unk=true;else tot+=e;txt=cat.d+' ('+cat.t+')'+(e!=null?': '+EUR(e):': importe pendiente')}
else txt=h+' aciertos: sin premio'}
html+='<div class="line"><b>'+(i+1)+'</b><div class="chips">'+v.map(x=>'<span class="chip'+(R.includes(x)?' hit':'')+'">'+pad(x)+'</span>').join('')+'</div><div class="verdict">'+txt+'</div></div>'});
if(!n){out.innerHTML='<div class="banner no">Escribe al menos una línea.</div>';return}
if(rei)won.add('r');
const refund=rei&&P&&P.r?n*P.r.e:null;
const head=prize?'<div class="banner ok">¡Hay premio!'+(P&&!unk?' '+EUR(tot+(refund||0)):'')+'</div>':rei?'<div class="banner ok">Te devuelven el dinero (reintegro)'+(refund!=null?': '+EUR(refund):'')+'</div>':'<div class="banner no">Esta vez no ha tocado</div>';
let res='<h3>Resultado de la semana</h3><div class="chips">'+R.map(x=>'<span class="chip hit">'+pad(x)+'</span>').join('')+'<span class="tag">Reint.</span><span class="chip'+(rei?' hit':'')+'">'+RR+'</span></div>';
if(rei&&prize)res+='<p>Además, tu reintegro coincide: te devuelven el dinero apostado'+(refund!=null?' ('+EUR(refund)+')':'')+'.</p>';
let tab='';
if(P)tab='<h3>Premios del sorteo</h3><table><tr><th>Categoría</th><th>Acertantes</th><th>Cada uno</th></tr>'+CATS.map(c=>{const x=P[c.k];return '<tr'+(won.has(c.k)?' class="mine"':'')+'><td>'+c.t+(c.d?' · '+c.d:'')+'</td><td>'+(x?x.a:'–')+'</td><td>'+(x?EUR(x.e):'–')+'</td></tr>'}).join('')+'</table>';
const bote=D.bote!=null?'<p><b>Bote del próximo sorteo:</b> '+EUR(D.bote)+'</p>':'';
const fd=f.split('-').reverse().join('/');
out.innerHTML='<div class="card res"><p class="hint">Sorteo del '+fd+'</p>'+head+res+'<h3>Mis líneas</h3>'+html+tab+bote+'</div>';
out.scrollIntoView({behavior:'smooth',block:'start'})}
</script></body></html>
